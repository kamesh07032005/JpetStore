spring.application.name=jpetstore-api
server.port=${SERVER_PORT:8080}
# Set DB_* in the environment; never commit real credentials.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jpetstore?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:jpetstore_app}
spring.datasource.password=${DB_PASSWORD:change-me-locally}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
